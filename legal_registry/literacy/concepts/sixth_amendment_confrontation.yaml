level_5_advanced_analysis: State courts universally hold that Crawford's Sixth Amendment
  confrontation rule does not govern juvenile dependency hearings (e.g. In re Mary
  S., 186 Cal. App. 3d 414; In re Dependency of A.E.P., 135 Wn.2d 208). Instead, cross-examination
  in family court is evaluated under the Mathews v. Eldridge due process balancing
  test. When child hearsay is admitted under specialized statutory exceptions, due
  process requires corroboration and safeguards ensuring substantial reliability.
