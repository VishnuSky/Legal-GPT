  SHOW_SOURCE:
    title: Sixth Amendment and Confrontation Authority
    content: Sixth Amendment text provides confrontation rights in criminal prosecutions;
      Fourteenth Amendment provides civil due process.
    citations:
    - U.S. Const. amend. VI
    - U.S. Const. amend. XIV, § 1
    official_sources:
    - https://www.govinfo.gov
  SHOW_STATUTE:
    title: Child Hearsay Exceptions in Dependency Proceedings
    content: State evidentiary codes establish specific exceptions allowing reliable
      statements of young children regarding abuse.
    citations:
    - Fed. R. Evid. 803
    - Fed. R. Evid. 804
    official_sources:
    - https://www.law.cornell.edu/rules/fre
  SHOW_CASE:
    title: 'Controlling Precedent: Crawford v. Washington, 541 U.S. 36 (2004)'
    content: Landmark ruling establishing criminal confrontation standards, highlighting
      the distinction with civil dependency matters.
    citations:
    - Crawford v. Washington, 541 U.S. 36 (2004)
    official_sources:
    - https://www.supremecourt.gov/
  EXPLAIN_OPPOSING:
    title: Child Protection from Trauma vs Parental Cross-Examination
    content: State child welfare agencies argue that requiring traumatized children
      to testify directly in court causes severe secondary trauma.
    citations:
    - Crawford v. Washington, 541 U.S. 36 (2004)
    official_sources:
    - https://www.supremecourt.gov/
  SHOW_TEMPORAL_CHANGE:
    title: Evolution of Video and In-Camera Child Testimony Rules
    content: Family courts have adopted closed-circuit television, videotaped interviews,
      and in-chambers interviews with counsel to balance child well-being and parental
      fairness.
    citations:
    - Crawford v. Washington, 541 U.S. 36 (2004)
    official_sources:
    - https://www.supremecourt.gov/
