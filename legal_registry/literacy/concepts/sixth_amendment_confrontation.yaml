  source_type: CASELAW
  official_portal_url: https://www.supremecourt.gov/opinions/03pdf/02-9410.pdf
  key_holding_or_text: 'Where testimonial evidence is at issue, however, the Sixth
    Amendment demands what the common law required: unavailability and a prior opportunity
    for cross-examination.'
  jurisdiction: US
  is_binding: true
  verification_status: VERIFIED
- citation: U.S. Const. amend. VI
