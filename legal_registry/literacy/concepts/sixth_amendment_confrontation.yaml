id: sixth_amendment_confrontation
canonical_name: Sixth Amendment Confrontation and Hearsay Distinction in Dependency
aliases:
- sixth amendment confrontation
- confrontation clause dependency
- crawford v washington
- hearsay in cps
- cross examination dependency
jurisdiction: US
retrieved_date: '2026-09-19'
level_1_plain_english: In criminal court, the Sixth Amendment gives defendants the
  absolute right to confront and cross-examine witnesses face-to-face. However, child
  welfare and dependency cases are civil matters, not criminal trials. While you do
  not get the full Sixth Amendment criminal guarantee, the Fourteenth Amendment Due
  Process Clause still gives you a right to challenge evidence, object to unreliable
  hearsay, and question witnesses who testify against you.
level_2_practical: Caseworkers often submit written reports containing rumors, second-hand
  statements, or anonymous hotline calls. Because dependency is a civil proceeding,
  judges sometimes consider written agency reports. But you and your lawyer have the
  right to subpoena the authors of those reports, call the caseworker to the stand,
  cross-examine them under oath, and expose factual inaccuracies or bias.
level_3_terminology: 'The Sixth Amendment Confrontation Clause (Crawford v. Washington,
  541 U.S. 36) strictly bars testimonial hearsay in criminal prosecutions unless the
  declarant is unavailable and the defendant had a prior opportunity for cross-examination.
  CRITICAL DISTINCTION: Because child dependency proceedings are civil actions, the
  Sixth Amendment does NOT apply directly. Instead, procedural fairness is governed
  by Fourteenth Amendment Due Process and state evidentiary rules (e.g. ER 801-804),
  which balance evidentiary reliability against the state''s interest in protecting
  child witnesses.'
level_4_primary_authority:
