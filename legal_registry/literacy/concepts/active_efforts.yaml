    title: "Official Primary Legal Authorities for Active Efforts"
    content: "United States Code: 25 U.S.C. § 1912(d) (uscode.house.gov); Code of Federal Regulations: 25 C.F.R. § 23.2 (ecfr.gov); Washington Revised Code: RCW 13.38.040 & RCW 13.38.130 (app.leg.wa.gov)."
    citations: ["25 U.S.C. § 1912", "25 C.F.R. § 23.2", "RCW 13.38.040", "RCW 13.38.130"]
    official_sources: ["https://uscode.house.gov/", "https://www.ecfr.gov/", "https://app.leg.wa.gov/rcw/default.aspx?cite=13.38.040"]
  SHOW_STATUTE:
    title: "Federal and Washington Active Efforts Mandates"
    content: "25 C.F.R. § 23.2 itemizes 11 required active efforts examples. RCW 13.38.040(1) codifies Washington state-level enforceable standards."
    citations: ["25 C.F.R. § 23.2", "RCW 13.38.040"]
    official_sources: ["https://www.ecfr.gov/", "https://app.leg.wa.gov/rcw/default.aspx?cite=13.38.040"]
  SHOW_CASE:
    title: "Caselaw Distinguishing Active Efforts from Passive Referrals"
    content: "Appellate courts hold that merely developing a case plan and expecting the parent to execute it independently constitutes passive, not active, efforts."
    citations: ["25 C.F.R. § 23.2"]
    official_sources: ["https://www.ecfr.gov/"]
  EXPLAIN_OPPOSING:
    title: "Opposing Interpretation: Futility & Parent Non-Cooperation"
    content: "Agency argument: Child welfare departments argue that when a parent repeatedly refuses contact, evades caseworkers, or explicitly rejects tribal services, active efforts should be excused under a judicial doctrine of futility."
    citations: ["25 C.F.R. § 23.2"]
    official_sources: ["https://www.ecfr.gov/"]
  SHOW_TEMPORAL_CHANGE:
    title: "2016 BIA Regulation Clarification of Active Efforts"
    content: "Prior to the 2016 federal regulations, state courts frequently blurred active and reasonable efforts. The 2016 BIA rule (25 C.F.R. § 23.2) explicitly codified that active efforts must be significantly more rigorous than Title IV-E reasonable efforts."
    citations: ["81 Fed. Reg. 38778 (2016)", "25 C.F.R. § 23.2"]
    official_sources: ["https://www.govinfo.gov"]
