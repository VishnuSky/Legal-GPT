id: permanency_planning
canonical_name: "Permanency Planning and Concurrent Case Goals"
aliases:
  - "permanency planning"
  - "permanency hearing"
  - "concurrent planning"
  - "asfa 15 of 22"
  - "12 month hearing"
jurisdiction: "US"
retrieved_date: "2026-09-18"
level_1_plain_english: >-
  Permanency planning is the court process designed to prevent children from being stuck in temporary foster care indefinitely.
  The law establishes a strict calendar: by a certain deadline (usually within 12 months), the court must make a firm decision
  about the child's permanent home—either returning home to parents, living permanently with relatives, or pursuing adoption.
level_2_practical: >-
  In practical terms for your situation: While you are working on your service plan to get your children back,
  DCYF will run 'concurrent planning'—meaning they work on a backup plan (such as placement with an aunt or foster parent)
  at the exact same time. Every 6 months there is a review hearing, and by month 12 there is a mandatory 'Permanency Planning Hearing.'
  If the child has been in out-of-home care for 15 of the past 22 months, federal law pressures the agency to file for termination
  unless a good cause exception applies.
level_3_terminology: >-
  Under Title IV-E and ASFA (42 U.S.C. § 675(5)(C)), a permanency hearing must occur no later than 12 months after the child enters
  foster care to determine the permanency plan: return home, adoption, legal guardianship, or placement with a fit and willing relative.
  In Washington, RCW 13.34.136 and RCW 13.34.145 codify permanency requirements, mandating that the primary goal must remain
  reunification unless the court enters findings that reasonable efforts have failed.
level_4_primary_authority:
