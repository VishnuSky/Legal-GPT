    source_type: "STATUTE"
    official_portal_url: "https://uscode.house.gov/view.xhtml?path=/prelim@title42/chapter7/subchapter4/partE&edition=prelim"
    key_holding_or_text: "Defines case review systems, mandating permanency planning hearings within 12 months and requiring termination petitions when a child has been in foster care for 15 of the most recent 22 months."
    jurisdiction: "US"
    is_binding: true
    verification_status: "VERIFIED"
  - citation: "RCW 13.34.136"
    source_type: "STATUTE"
    official_portal_url: "https://app.leg.wa.gov/rcw/default.aspx?cite=13.34.136"
    key_holding_or_text: "Requires the permanency plan to identify primary and concurrent goals, services to be provided, and steps toward achieving a permanent home."
    jurisdiction: "WA"
    is_binding: true
    verification_status: "VERIFIED"
  - citation: "RCW 13.34.145"
    source_type: "STATUTE"
    official_portal_url: "https://app.leg.wa.gov/rcw/default.aspx?cite=13.34.145"
    key_holding_or_text: "Mandates an initial permanency planning hearing within 12 months of removal and specifies court inquiries into reunification progress and barrier removal."
    jurisdiction: "WA"
    is_binding: true
    verification_status: "VERIFIED"
level_5_advanced_analysis: >-
  The core structural tension in permanency planning involves the collision between federal ASFA fiscal timelines
  and constitutional parental rights under Santosky and Troxel. While 42 U.S.C. § 675(5)(E) creates a presumption of filing
  for termination at 15 of 22 months, Washington law (RCW 13.34.145) recognizes explicit 'good cause' exceptions:
  (a) the child is placed with a relative; (b) the department has not provided necessary services; or (c) compelling reasons
  exist showing termination is not in the child's best interests. Skillful defense counsel uses agency service delays to block TPR filings.
