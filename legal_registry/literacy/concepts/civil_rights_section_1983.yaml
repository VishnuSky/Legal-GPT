id: civil_rights_section_1983
canonical_name: Civil Rights Remedy Under 42 U.S.C. § 1983
aliases:
- section 1983
- 42 usc 1983
- civil rights lawsuit
- monell
- suing cps
- violated my civil rights
jurisdiction: US
retrieved_date: '2026-09-19'
level_1_plain_english: Section 1983 is a powerful federal law that allows everyday
  citizens to sue government workers or municipalities in federal court when those
  officials abuse their official authority to violate your constitutional rights.
level_2_practical: 'If caseworkers or police officers break the law—such as seizing
  your children without a warrant or emergency, fabricating false evidence in court
  reports, or retaliating against you for exercising your free speech—you may have
  grounds to file a federal civil rights lawsuit for monetary damages or court orders
  barring their illegal practices. Note: Claiming a civil rights violation is an assertion
  by the individual, not an established judicial fact.'
level_3_terminology: 'Under 42 U.S.C. § 1983, a plaintiff must prove that: (1) the
  defendant acted ''under color of state law''; and (2) their conduct deprived the
  plaintiff of a right secured by the U.S. Constitution or federal statutes. Under
  Monell v. Dept. of Social Services, 436 U.S. 658, local governments and municipal
  agencies can be liable only if the constitutional violation was caused by an official
  policy, custom, or systemic failure to train.'
level_4_primary_authority:
- citation: 42 U.S.C. § 1983
  source_type: STATUTE
  official_portal_url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section1983&num=0&edition=prelim
  key_holding_or_text: Every person who, under color of any statute, ordinance, regulation,
    custom, or usage, of any State... subjects, or causes to be subjected, any citizen
    of the United States... to the deprivation of any rights, privileges, or immunities
    secured by the Constitution and laws, shall be liable to the party injured.
  jurisdiction: US
  is_binding: true
  verification_status: VERIFIED
- citation: Monell v. Dept. of Social Services, 436 U.S. 658 (1978)
  source_type: CASELAW
  official_portal_url: https://www.supremecourt.gov/
  key_holding_or_text: Local governing bodies can be sued directly under § 1983 for
    monetary, declaratory, or injunctive relief where the action that is alleged to
    be unconstitutional implements or executes a policy statement, ordinance, regulation,
    or decision officially adopted and promulgated by that body's officers.
  jurisdiction: US
  is_binding: true
  verification_status: VERIFIED
level_5_advanced_analysis: 'Litigating § 1983 child welfare actions requires navigating
  two formidable federal doctrines: (1) Qualified Immunity, which shields individual
  workers unless they violated ''clearly established'' statutory or constitutional
  rights that every reasonable official would have known; and (2) The Rooker-Feldman
  and Younger abstention doctrines, which prohibit federal district courts from reviewing
  or interfering with ongoing state family court proceedings. Federal damages suits
  typically proceed after state court adjudication concludes.'
drill_downs:
  SHOW_SOURCE:
    title: Federal Civil Rights Statute Text
    content: 42 U.S.C. § 1983 authorizes civil actions for deprivation of constitutional
      rights under color of state law.
    citations:
    - 42 U.S.C. § 1983
    official_sources:
    - https://uscode.house.gov/
  SHOW_STATUTE:
    title: Civil Rights Attorney's Fees Awards Act
    content: 42 U.S.C. § 1988 permits prevailing plaintiffs in § 1983 actions to recover
      reasonable attorney's fees.
    citations:
    - 42 U.S.C. § 1988
    official_sources:
    - https://uscode.house.gov/
  SHOW_CASE:
    title: 'Controlling Precedent: Monell v. Dept. of Social Services, 436 U.S. 658
      (1978)'
    content: Establishes municipal liability standards under § 1983 for unconstitutional
      agency policies or customs.
    citations:
    - Monell v. Dept. of Social Services, 436 U.S. 658 (1978)
    official_sources:
    - https://www.supremecourt.gov/
  EXPLAIN_OPPOSING:
    title: Qualified Immunity and Absolute Prosecutorial Immunity Defenses
    content: Caseworkers and agency attorneys assert qualified immunity for investigative
      acts and quasi-prosecutorial immunity for initiating dependency petitions.
    citations:
    - Monell v. Dept. of Social Services, 436 U.S. 658 (1978)
    official_sources:
    - https://www.supremecourt.gov/
  SHOW_TEMPORAL_CHANGE:
    title: Judicial Rejection of Absolute Immunity for Falsifying Evidence
    content: Modern federal decisions uniformly hold that social workers do not possess
      immunity for submitting deliberately fabricated evidence or perjury in sworn
      removal declarations.
    citations:
    - 42 U.S.C. § 1983
    official_sources:
    - https://uscode.house.gov/
