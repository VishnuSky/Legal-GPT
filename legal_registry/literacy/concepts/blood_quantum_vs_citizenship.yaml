id: blood_quantum_vs_citizenship
canonical_name: Blood Quantum vs Tribal Citizenship and Political Classification
aliases:
- blood quantum
- tribal citizenship
- santa clara pueblo
- tribal enrollment
- political classification morton v mancari
jurisdiction: FED
retrieved_date: '2026-09-19'
level_1_plain_english: Tribal citizenship is a political status, not a racial category.
  Just as the United States or France decides who its citizens are, each tribal nation
  has the absolute sovereign right to set its own membership criteria. Under U.S.
  Supreme Court precedent, being Native American in federal law is a political relationship
  between a citizen and their sovereign tribe.
level_2_practical: If a court or caseworker claims that child welfare laws or tribal
  rights are based on 'racial discrimination,' that claim is legally incorrect under
  federal law. In Morton v. Mancari and Haaland v. Brackeen, the Supreme Court confirmed
  that tribal rights apply because of citizenship in a self-governing political nation.
  Legal-GPT never defines who is or is not a tribal member; that authority belongs
  exclusively to each tribal nation.
level_3_terminology: The distinction between racial classification and political status
  is grounded in Morton v. Mancari (417 U.S. 535), which held that federal preferences
  for tribal members are political rather than racial, subject to rational basis review.
  In Santa Clara Pueblo v. Martinez (436 U.S. 49), the Supreme Court affirmed that
  a tribe's right to define its own membership for tribal purposes has long been recognized
  as central to its existence as an independent political community. Federal definitions
  (such as 25 U.S.C. § 1603 or 25 U.S.C. § 1903(4)) defer to tribal citizenship determinations.
