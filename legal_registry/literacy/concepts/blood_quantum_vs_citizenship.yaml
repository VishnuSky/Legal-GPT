level_5_advanced_analysis: 'Domestic U.S. law vs. International Norms:

  - Domestic Law: While federal courts treat tribal enrollment as a political status,
  federal statutes and administrative regulations historically imposed external ''blood
  quantum'' standards (e.g. 1/4 degree Indian blood) for federal service eligibility
  (25 U.S.C. § 1603), originating from 19th-century allotment rolls.

  - UNDRIP (International Norm — non-binding in U.S. domestic proceedings): Article
  33 affirms that Indigenous peoples have the right to determine their own identity
  or membership in accordance with their customs and traditions, free from external
  state-imposed criteria.

  - Alignment & Divergence: Santa Clara Pueblo aligns with UNDRIP by upholding tribal
  sovereignty over citizenship, but historical federal reliance on blood quantum fractions
  in statutory schemes creates ongoing tensions with traditional lineage systems.

  - Competing Positions: Opponents of tribal programs argue that blood quantum elements
  in tribal constitutions or federal criteria function as racial proxies. Tribal nations
  maintain that lineage-based criteria are standard citizenship mechanisms utilized
  by sovereign nations worldwide (jus sanguinis) and that tribal citizenship is exclusively
  a political bond.'
drill_downs:
  SHOW_SOURCE:
    title: Primary Authority on Tribal Membership
    content: Santa Clara Pueblo v. Martinez (436 U.S. 49) establishes exclusive tribal
      authority over membership.
    citations:
    - Santa Clara Pueblo v. Martinez, 436 U.S. 49 (1978)
    official_sources:
    - https://supreme.justia.com/cases/federal/us/436/49/
  SHOW_STATUTE:
    title: ICWA Definition of Indian Child
    content: 25 U.S.C. § 1903(4) defines Indian child based on tribal membership or
      eligibility for membership combined with a biological parent's membership.
    citations:
    - 25 U.S.C. § 1903(4)
    official_sources:
    - https://uscode.house.gov/
  SHOW_CASE:
    title: 'Controlling Precedent: Morton v. Mancari, 417 U.S. 535 (1974)'
    content: Holding that Indian legal status is political rather than racial, surviving
      equal protection scrutiny under rational basis review.
    citations:
    - Morton v. Mancari, 417 U.S. 535 (1974)
    official_sources:
    - https://supreme.justia.com/cases/federal/us/417/535/
  EXPLAIN_OPPOSING:
    title: Equal Protection Challenges to ICWA Preferences
    content: Challengers in Brackeen argued that ICWA's third placement preference
      (other Indian families) constitutes racial classification; the Supreme Court
      dismissed the claim for lack of standing.
    citations:
    - Haaland v. Brackeen, 599 U.S. 255 (2023)
    official_sources:
    - https://supreme.justia.com/cases/federal/us/599/255/
  SHOW_TEMPORAL_CHANGE:
    title: Tribal Transition from Federal Blood Quantum to Lineal Descent
    content: Many tribal nations have amended their constitutions to replace BIA-mandated
      blood quantum requirements with lineal descent from historical base rolls.
    citations:
    - Santa Clara Pueblo v. Martinez, 436 U.S. 49 (1978)
    official_sources:
    - https://supreme.justia.com/cases/federal/us/436/49/
