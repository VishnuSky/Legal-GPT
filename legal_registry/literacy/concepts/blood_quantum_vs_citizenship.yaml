- citation: Morton v. Mancari, 417 U.S. 535 (1974)
  source_type: CASELAW
  official_portal_url: https://supreme.justia.com/cases/federal/us/417/535/
  key_holding_or_text: Literally every piece of legislation dealing with Indian tribes...
    single out for special treatment a constituency of tribal Indians. If these laws,
    derived from historical relationships and treaties, were deemed invidious racial
    classifications, an entire Title of the United States Code would be effectively
    erased... The preference is political, not racial.
  jurisdiction: US
  is_binding: true
