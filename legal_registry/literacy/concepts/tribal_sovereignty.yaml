    - https://supreme.justia.com/cases/federal/us/31/515/
  SHOW_STATUTE:
    title: Federal Statutes Affirming Tribal Self-Determination
    content: Indian Self-Determination and Education Assistance Act of 1975 (25 U.S.C.
      § 5301 et seq.) authorizing tribal administration of federal programs.
    citations:
    - 25 U.S.C. § 5301
    official_sources:
    - https://uscode.house.gov/
  SHOW_CASE:
    title: 'Controlling Precedent: Worcester v. Georgia, 31 U.S. 515 (1832)'
    content: Holding that tribal nations are independent political communities free
      from state jurisdictional control.
    citations:
    - Worcester v. Georgia, 31 U.S. 515 (1832)
    official_sources:
    - https://supreme.justia.com/cases/federal/us/31/515/
  EXPLAIN_OPPOSING:
    title: State Encroachment vs Tribal Exclusive Sovereignty
    content: States argue that statehood and general police powers permit concurrent
      jurisdiction over non-members or fee lands within reservations.
    citations:
    - Oklahoma v. Castro-Huerta, 597 U.S. 629 (2022)
    official_sources:
    - https://supreme.justia.com/cases/federal/us/597/629/
  SHOW_TEMPORAL_CHANGE:
    title: Evolution from Termination to Self-Determination Policy
    content: In 1970, President Nixon formally repudiated the 1950s termination policy,
      ushering in the modern federal policy of tribal self-determination.
    citations:
    - 25 U.S.C. § 5301
    official_sources:
    - https://uscode.house.gov/
