    citations:
    - 25 C.F.R. § 23.2
    official_sources:
    - https://www.ecfr.gov/
  SHOW_CASE:
    title: 'Controlling Precedent: Haaland v. Brackeen, 599 U.S. 255 (2023)'
    content: Supreme Court held that ICWA's statutory requirements are constitutional
      exercises of congressional Article I power.
    citations:
    - Haaland v. Brackeen, 599 U.S. 255 (2023)
    official_sources:
