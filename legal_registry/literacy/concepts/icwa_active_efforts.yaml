    title: ASFA Timeline Conflicts
    content: Agencies argue that ASFA's 15/22 month termination timeline conflicts
      with extensive active efforts, but federal regulations make clear ICWA controls.
    citations:
    - 42 U.S.C. § 675(5)(E)
    - 25 C.F.R. § 23.106
    official_sources:
