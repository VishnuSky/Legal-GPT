  SHOW_SOURCE:
    title: Voting Rights Act Statutory Provisions
    content: 52 U.S.C. §§ 10301 and 10503 protect minority voters and mandate bilingual
      assistance for Native language groups.
    citations:
    - 52 U.S.C. § 10301
    - 52 U.S.C. § 10503
    official_sources:
    - https://uscode.house.gov/
  SHOW_STATUTE:
    title: National Voter Registration Act
    content: 52 U.S.C. § 20508 regulates federal voter registration forms, preventing
      states from adding unauthorized barriers.
    citations:
    - 52 U.S.C. § 20508
    official_sources:
    - https://uscode.house.gov/
  SHOW_CASE:
    title: 'Controlling Precedent: Arizona v. Inter Tribal Council of Arizona (2013)'
    content: Holding that federal voter registration forms preempt restrictive state
      documentary proof requirements under the Elections Clause.
    citations:
    - Arizona v. Inter Tribal Council of Arizona, Inc., 570 U.S. 1 (2013)
    official_sources:
    - https://supreme.justia.com/cases/federal/us/570/1/
  EXPLAIN_OPPOSING:
    title: State Election Integrity Arguments in Brnovich
    content: In Brnovich v. DNC (2021), Arizona successfully defended out-of-precinct
      ballot rejection and third-party ballot collection bans under Section 2 review.
    citations:
    - Brnovich v. Democratic National Committee, 594 U.S. 647 (2021)
    official_sources:
    - https://supreme.justia.com/cases/federal/us/594/19-1257/
  SHOW_TEMPORAL_CHANGE:
    title: Historical Disenfranchisement to Modern Legal Protections
    content: Although the Indian Citizenship Act was passed in 1924, states like Arizona
      and New Mexico excluded Native voters until state supreme court decisions in
      1948 (Harrison v. Laveen, 196 P.2d 456).
    citations:
    - Harrison v. Laveen, 196 P.2d 456 (Ariz. 1948)
    official_sources:
    - https://scholar.google.com/
