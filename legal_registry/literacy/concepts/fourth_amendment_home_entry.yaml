  SHOW_SOURCE:
    title: Constitutional Text of the Fourth Amendment
    content: U.S. Constitution, Fourth Amendment guarantees the right to be secure
      in houses against unreasonable searches.
    citations:
    - U.S. Const. amend. IV
    official_sources:
    - https://www.govinfo.gov
  SHOW_STATUTE:
    title: Statutory Authority for Judicial Entry Orders
    content: Administrative search warrants and dependency pickup orders require sworn
      affidavits demonstrating probable cause of imminent harm.
    citations:
    - 42 U.S.C. § 1983
    - U.S. Const. amend. IV
    official_sources:
    - https://uscode.house.gov/
  SHOW_CASE:
    title: 'Controlling Precedent: Brigham City v. Stuart, 547 U.S. 398 (2006)'
    content: Emergency aid exception permits warrantless home entry only when officers
      have an objectively reasonable basis to believe an occupant is seriously injured
      or imminently threatened.
    citations:
    - Brigham City v. Stuart, 547 U.S. 398 (2006)
    official_sources:
    - https://www.supremecourt.gov/
  EXPLAIN_OPPOSING:
    title: 'Government Position: Community Caretaking and Child Welfare Exigency'
    content: Caseworkers argue that the state's parens patriae interest requires rapid
      inspection of living quarters when responding to severe child abuse allegations.
    citations:
    - Brigham City v. Stuart, 547 U.S. 398 (2006)
    official_sources:
    - https://www.supremecourt.gov/
  SHOW_TEMPORAL_CHANGE:
    title: Narrowing of Administrative Search Exceptions
    content: Modern doctrine has rejected broad 'social worker exceptions' to the
      Fourth Amendment, holding caseworkers strictly accountable to traditional warrant
      requirements.
    citations:
    - Brigham City v. Stuart, 547 U.S. 398 (2006)
    official_sources:
    - https://www.supremecourt.gov/
