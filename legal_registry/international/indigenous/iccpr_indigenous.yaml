instrument: International Covenant on Civil and Political Rights (ICCPR)
adopted: December 16, 1966 (UN General Assembly)
us_ratification_status: Ratified by the United States Senate on April 2, 1992
indigenous_rights_article:
  article: 27
  text: In those States in which ethnic, religious or linguistic minorities exist,
    persons belonging to such minorities shall not be denied the right, in community
    with the other members of their group, to enjoy their own culture, to profess
    and practise their own religion, or to use their own language.
us_reservations_declarations:
  non_self_executing_declaration: The United States Senate declared Articles 1 through
    27 of the ICCPR to be non-self-executing, meaning they do not create an independent
    private cause of action in domestic U.S. courts without implementing legislation.
  indigenous_impact: Tribal litigants cannot directly enforce Article 27 in federal
    court to enjoin domestic agency decisions.
official_url: https://www.ohchr.org/en/instruments-mechanisms/instruments/international-covenant-civil-and-political-rights
verification_status: VERIFIED
