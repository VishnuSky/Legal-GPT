    metadata:
      emergency_removal:
        citation: "N.C.G.S. § 7B-500"
        text_excerpt: "A temporary custody order or warrantless custody may be exercised by law enforcement or designated DSS worker if there are reasonable grounds to believe that the juvenile is abused, neglected, or dependent and would be injured or could not be taken into custody if not immediately seized."
      shelter_hearing_deadline_hours: 168 # 7 calendar days
      dependency_petition_deadline: "Filed simultaneously with or prior to issuance of nonsecure custody order (N.C.G.S. § 7B-405)"
      adjudicatory_hearing_deadline: "Shall be held within 60 days of petition filing unless continued for good cause (N.C.G.S. § 7B-801(c))"
      reasonable_efforts_requirement:
        citation: "N.C.G.S. § 7B-507 / § 7B-903"
        text_excerpt: "An order placing or continuing custody with county department must contain findings as to whether DSS made reasonable efforts to prevent or eliminate the need for placement."
      relative_placement_preference:
        citation: "N.C.G.S. § 7B-505(b) / § 7B-903(a1)"
        text_excerpt: "The court shall first consider whether a relative of the juvenile is willing and able to provide proper care and placement in a safe home."
      tpr_grounds:
        citation: "N.C.G.S. § 7B-1111"
        text_excerpt: "The court may terminate parental rights upon finding by clear, cogent, and convincing evidence that one or more statutory grounds exist."
      right_to_counsel:
        citation: "N.C.G.S. § 7B-602"
        text_excerpt: "In cases where petition alleges abuse, neglect, or dependency, parents have the right to appointed counsel if indigent, unless counsel is voluntarily and knowingly waived."
      icwa_inquiry_requirement:
        citation: "N.C.G.S. § 7B-505.1 / 25 U.S.C. § 1912"
        text_excerpt: "At each stage of the proceedings the court shall inquire as to whether the juvenile is or may be an Indian child under federal law."
