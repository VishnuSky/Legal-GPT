    metadata:
      emergency_removal:
        citation: "MCL 712A.14"
        text_excerpt: "Any local police officer, county sheriff or state trooper may take a child into custody without a court order if the officer has reasonable cause to believe that the child's conditions or surroundings are such as to endanger his health, morals, or welfare."
      shelter_hearing_deadline_hours: 24 # 24 hours excluding Sundays and holidays
      dependency_petition_deadline: "Petition must be authorized or filed at the preliminary hearing within 24 hours (MCR 3.965(A)(1))"
      adjudicatory_hearing_deadline: "Trial must commence within 63 days after the child is placed in out-of-home care (MCR 3.972(A))"
      reasonable_efforts_requirement:
        citation: "MCL 712A.18f / MCL 712A.19a"
        text_excerpt: "Before the court orders placement outside the home, the supervising agency must demonstrate that reasonable efforts were made to prevent removal and maintain the child in the home."
      relative_placement_preference:
        citation: "MCL 712A.13a(9) / MCL 722.954a"
        text_excerpt: "Within 30 days after removal, the agency must identify, locate, and notify all adult grandparents and adult relatives, giving them priority placement consideration."
      tpr_grounds:
        citation: "MCL 712A.19b(3)"
        text_excerpt: "The court may terminate parental rights to a child if the court finds by clear and convincing evidence that 1 or more statutory grounds have been established."
      right_to_counsel:
        citation: "MCL 712A.17c / MCR 3.915"
        text_excerpt: "The respondent parent has the right to be represented by an attorney at each stage of the proceedings. If the respondent parent is indigent, the court shall appoint an attorney."
      icwa_inquiry_requirement:
        citation: "MCL 712B.1 et seq. (MIFPA) / 25 U.S.C. § 1912"
        text_excerpt: "Under the Michigan Indian Family Preservation Act, the court must inquire at the initial hearing whether the child or either parent is a member of an Indian tribe."
