    metadata:
      emergency_removal:
        citation: "O.C.G.A. § 15-11-133"
        text_excerpt: "A child may be taken into temporary custody by a law enforcement officer or employee of the department if there are reasonable grounds to believe that the child is suffering from illness or injury or is in immediate danger from his or her surroundings and that removal is necessary."
      shelter_hearing_deadline_hours: 72
      dependency_petition_deadline: "Within 5 days after preliminary protective hearing if child is in custody (O.C.G.A. § 15-11-151)"
      adjudicatory_hearing_deadline: "Within 30 days of petition filing if child in custody; within 60 days if not in custody (O.C.G.A. § 15-11-181)"
      reasonable_efforts_requirement:
        citation: "O.C.G.A. § 15-11-202"
        text_excerpt: "DFCS must make reasonable efforts to preserve and reunify families prior to the placement of a child in foster care to prevent or eliminate the need for removing the child."
      relative_placement_preference:
        citation: "O.C.G.A. § 15-11-135 / § 15-11-211"
        text_excerpt: "DFCS must give preference to an adult relative over a nonrelated foster parent, provided the relative meets all relevant child protection standards."
      tpr_grounds:
        citation: "O.C.G.A. § 15-11-310"
        text_excerpt: "The court may terminate parental rights upon statutory grounds proved by clear and convincing evidence, including lack of parental care and inability to remedy causes of dependency."
      right_to_counsel:
        citation: "O.C.G.A. § 15-11-103"
        text_excerpt: "A child and each parent or guardian are entitled to legal representation in all dependency proceedings. If a parent is indigent, the court shall appoint an attorney."
      icwa_inquiry_requirement:
        citation: "O.C.G.A. § 15-11-152 / 25 U.S.C. § 1912"
        text_excerpt: "The petition and court inquiry must state whether the child subject to proceedings is an Indian child within the meaning of the Indian Child Welfare Act."
