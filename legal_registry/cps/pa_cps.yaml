    metadata:
      emergency_removal:
        citation: "42 Pa. C.S. § 6324 / 23 Pa. C.S. § 6315"
        text_excerpt: "A child may be taken into custody pursuant to the laws of arrest or by a law enforcement officer or authorized child welfare worker if there are reasonable grounds to believe that the child is suffering from illness or injury or is in imminent danger from his surroundings and removal is necessary."
      shelter_hearing_deadline_hours: 72
      dependency_petition_deadline: "Within 24 to 48 hours after child is taken into custody"
      adjudicatory_hearing_deadline: "Within 10 days if child remains in detention; within 30 days if not detained (42 Pa. C.S. § 6335)"
      reasonable_efforts_requirement:
        citation: "42 Pa. C.S. § 6351(b)(2)"
        text_excerpt: "The court must determine whether reasonable efforts were made prior to placement of the child to prevent or eliminate the need for removal from the home."
      relative_placement_preference:
        citation: "42 Pa. C.S. § 6351(a)(2.1)"
        text_excerpt: "County agency must conduct diligent search for fit and willing relatives, including adult grandparents, to be considered for placement preference."
      tpr_grounds:
        citation: "23 Pa. C.S. § 2511"
        text_excerpt: "The rights of a parent in regard to a child may be terminated after a petition filed on any of the specified statutory grounds, proved by clear and convincing evidence."
      right_to_counsel:
        citation: "42 Pa. C.S. § 6337"
        text_excerpt: "Except as otherwise provided under this chapter a party is entitled to representation by legal counsel at all stages of any proceedings under this chapter and if he is without financial resources to employ counsel, to have the court provide counsel."
      icwa_inquiry_requirement:
        citation: "Pa. R.J.C.P. 1120 / 25 U.S.C. § 1912"
        text_excerpt: "The court and county agency have an affirmative and continuing duty to inquire whether a child involved in a dependency proceeding is an Indian child."
