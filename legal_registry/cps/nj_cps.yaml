    metadata:
      emergency_removal:
        citation: "N.J.S.A. 9:6-8.29"
        text_excerpt: "The division or designated peace officer may remove a child from his place of residence without court order (Dodd removal) if the child is in such condition that his continuing in said place of residence presents an imminent danger to the child's life, safety, or health."
      shelter_hearing_deadline_hours: 48 # Next court day / within 2 court days
      dependency_petition_deadline: "Division must file verified complaint and apply for order to show cause within 2 court days following removal (N.J.S.A. 9:6-8.30(a))"
      adjudicatory_hearing_deadline: "Fact-finding hearing shall be completed within 60 days of the filing of the complaint (Rule 5:12-4)"
      reasonable_efforts_requirement:
        citation: "N.J.S.A. 30:4C-15.1(a)(3) / N.J.S.A. 9:6-8.8"
        text_excerpt: "DCPP must make reasonable efforts to provide services to help the parent correct the circumstances which led to the child's placement outside the home."
      relative_placement_preference:
        citation: "N.J.S.A. 30:4C-12.1"
        text_excerpt: "DCPP must initiate search for adult relatives within 30 days of placement and assess each willing relative for placement priority."
      tpr_grounds:
        citation: "N.J.S.A. 30:4C-15.1"
        text_excerpt: "DCPP must establish all four prongs of the best interests standard by clear and convincing evidence to terminate parental rights."
      right_to_counsel:
        citation: "N.J.S.A. 9:6-8.43 / N.J.S.A. 30:4C-15.4"
        text_excerpt: "The court shall advise the parent of their right to be represented by counsel and if indigent, refer the parent to the Office of Parental Representation in the Office of the Public Defender."
      icwa_inquiry_requirement:
        citation: "N.J. Court Rule 5:12-1 / 25 U.S.C. § 1912"
        text_excerpt: "The complaint must identify whether the child is of Native American descent and the court must conduct ICWA inquiry at the preliminary hearing."
