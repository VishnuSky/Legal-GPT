    metadata:
      emergency_removal:
        citation: "Va. Code § 16.1-251 / § 16.1-247"
        text_excerpt: "An emergency removal order may be issued ex parte upon finding that the child would be subjected to an imminent threat to life or health to the extent that severe or irremediable injury would be likely to result if returned to or left in custody of parents."
      shelter_hearing_deadline_hours: 72
      dependency_petition_deadline: "Petition alleging abuse or neglect must be filed prior to or contemporaneously with emergency removal order (Va. Code § 16.1-251(A))"
      adjudicatory_hearing_deadline: "Shall be held within 30 days of the preliminary removal hearing (Va. Code § 16.1-252(G))"
      reasonable_efforts_requirement:
        citation: "Va. Code § 16.1-252(E) / § 16.1-281"
        text_excerpt: "The court must determine whether reasonable efforts have been made by the local department to prevent or eliminate the need for removal from the home."
      relative_placement_preference:
        citation: "Va. Code § 16.1-278.2 / § 63.2-900"
        text_excerpt: "Prior to placing child in foster care, local board shall consider placement with a fit and willing relative, including kinship foster care."
      tpr_grounds:
        citation: "Va. Code § 16.1-283"
        text_excerpt: "Residual parental rights of a parent may be terminated upon proof by clear and convincing evidence that termination is in best interests of child and statutory grounds exist."
      right_to_counsel:
        citation: "Va. Code § 16.1-266"
        text_excerpt: "Prior to the hearing, the court shall appoint a guardian ad litem for the child and counsel for the parent if the parent is indigent and does not knowingly waive representation."
      icwa_inquiry_requirement:
        citation: "Va. Code § 16.1-252 / 25 U.S.C. § 1912"
        text_excerpt: "The court and department shall inquire into the tribal membership or eligibility of the child to determine applicability of the federal Indian Child Welfare Act."
