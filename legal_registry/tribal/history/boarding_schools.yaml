subject: Federal Indian Boarding School Policy
period: approximately 1819-1969
official_investigation:
  title: Federal Indian Boarding School Initiative Investigative Report
  published: May 2022
  agency: U.S. Department of the Interior
  url: https://www.doi.gov/sites/doi.gov/files/2022-06/bsi_investigative_report_june_2022_0.pdf
  key_findings:
  - The Federal Indian boarding school system had a minimum of 408 Federal Indian
    boarding schools across 37 states or then-territories.
  - The report identified marked or unmarked burial sites at a minimum of 53 schools
    across the system.
  - The system forcibly assimilated Indian children by separating them from their
    families, languages, religions, and cultural communities.
  - The federal government directly supported the institutions through federal funds,
    treaties, and compulsory attendance enforcement.
statutory_basis:
- Civilization Fund Act of 1819, 3 Stat. 516 (authorizing annual federal appropriations
  to stimulate assimilation through education)
- Act of July 13, 1892, 27 Stat. 120, 143 (authorizing Commissioner of Indian Affairs
  to enforce compulsory school attendance)
legal_relevance:
- 'Congressional foundation for the Indian Child Welfare Act: 25 U.S.C. § 1901(3)
  references the systematic breakup of Indian families'
- Trauma-informed judicial practice in modern state juvenile and dependency court
  proceedings
- Intergenerational trauma evidentiary considerations in placement preference assessments
status: VERIFIED (DOI primary source)
