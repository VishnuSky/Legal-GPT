- date: '1823'
  event: Johnson v. M'Intosh — Doctrine of Discovery codified into U.S. law
  authority: 21 U.S. 543
  legal_effect: Established that European discovery extinguished Native complete title
    of occupancy under U.S. law, reducing indigenous tenure to a right of occupancy
    subject to federal extinguishment.
  current_status: Technically unreversed in U.S. domestic law as of 2026
  international_critique: UNDRIP Arts. 10, 26; UN Special Rapporteur on Rights of
    Indigenous Peoples has called for formal repudiation.
  official_url: https://supreme.justia.com/cases/federal/us/21/543/
- date: '1830'
  event: Indian Removal Act signed into law
  authority: 4 Stat. 411
  legal_effect: Authorized the President to negotiate removal treaties ceding eastern
    ancestral lands in exchange for western territory.
  historical_outcome: Led to forced removals including the Cherokee, Creek, Choctaw,
    Chickasaw, and Seminole Trail of Tears; DOI/NPS records document 4,000+ Cherokee
    deaths.
  official_url: https://www.loc.gov/law/help/statutes-at-large/21st-congress/session-1/c21s1ch148.pdf
- date: '1831'
  event: Cherokee Nation v. Georgia — domestic dependent nations doctrine
  authority: 30 U.S. 1
  legal_effect: Characterized tribes as 'domestic dependent nations' in a relationship
    resembling a ward to a guardian.
  current_status: Foundational precedent for federal trust responsibility and limited
    original Supreme Court jurisdiction.
  official_url: https://supreme.justia.com/cases/federal/us/30/1/
- date: '1832'
  event: Worcester v. Georgia — tribal nations outside state authority
  authority: 31 U.S. 515
  legal_effect: Held that the laws of Georgia had no force in Cherokee territory,
    establishing tribal sovereignty outside state jurisdiction.
  current_status: Foundational precedent for exclusive federal-tribal government-to-government
    relations.
  official_url: https://supreme.justia.com/cases/federal/us/31/515/
- date: '1851'
  event: Indian Appropriations Act of 1851 — Reservation System
  authority: 9 Stat. 574
  legal_effect: Authorized federal creation of Indian reservations throughout the
    West, restricting tribal nations to bounded federal land parcels.
  current_status: Established the structural foundation of modern reservation boundaries.
  official_url: https://www.loc.gov/law/help/statutes-at-large/31st-congress/session-2/c31s2ch14.pdf
- date: '1871'
  event: End of treaty-making era (Indian Appropriations Act rider)
  authority: 25 U.S.C. § 71 (16 Stat. 566)
  legal_effect: Congress terminated the practice of entering into treaties with Indian
    tribes, while explicitly providing that preexisting treaties remain valid obligations.
  current_status: Controlling statutory law; subsequent federal-tribal agreements
    occur via statutes and executive agreements.
  official_url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title25-section71&num=0&edition=prelim
- date: '1887'
  event: Dawes Act (General Allotment Act)
  authority: 24 Stat. 388
  legal_effect: Authorized division of communal tribal reservation lands into individual
    parcels, opening 'surplus' lands to non-Indian homesteading.
  historical_outcome: 'Tribal land holdings fell from approximately 138 million acres
    in 1887 to 48 million acres by 1934 (source: Meriam Report 1928; DOI records).'
  official_url: https://www.loc.gov/law/help/statutes-at-large/49th-congress/session-2/c49s2ch119.pdf
- date: '1903'
  event: Lone Wolf v. Hitchcock — Congressional plenary power to abrogate treaties
  authority: 187 U.S. 553
  legal_effect: Held that Congress possesses plenary power to unilaterally abrogate
    Indian treaties without judicial intervention.
  current_status: Controlling domestic precedent, heavily criticized in international
    human rights scholarship.
  official_url: https://supreme.justia.com/cases/federal/us/187/553/
- date: '1924'
  event: Indian Citizenship Act (Snyder Act)
  authority: 43 Stat. 253 (8 U.S.C. § 1401(b))
  legal_effect: Conferred U.S. citizenship on all Native Americans born within the
    territorial limits of the United States.
  historical_note: Did not automatically guarantee state voting rights; several states
    maintained disenfranchising voting barriers through the 1950s.
  official_url: https://www.loc.gov/law/help/statutes-at-large/68th-congress/session-1/c68s1ch233.pdf
- date: '1934'
  event: Indian Reorganization Act (Wheeler-Howard Act)
  authority: 25 U.S.C. § 461 et seq. (48 Stat. 984)
  legal_effect: Formally ended allotment policy, protected remaining communal tribal
    lands, and encouraged tribal constitutional self-governance.
  current_status: Fundamental charter of modern tribal corporate and governmental
    organization.
  official_url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title25-section461&num=0&edition=prelim
- date: '1953'
  event: House Concurrent Resolution 108 — Federal Termination Policy
  authority: H. Con. Res. 108, 67 Stat. B132; Public Law 83-280
  legal_effect: Declared federal policy to terminate government-to-government recognition
    of 109 tribal nations and transfer jurisdiction to states.
  historical_outcome: Caused profound economic and cultural disruption; formally repudiated
    by President Nixon in 1970; Menominee Restoration Act (1973) began restoration
    era.
  official_url: https://www.loc.gov/law/help/statutes-at-large/83rd-congress/session-1/c83s1res108.pdf
- date: '1968'
  event: Indian Civil Rights Act (ICRA)
  authority: 25 U.S.C. §§ 1301-1303 (82 Stat. 77)
  legal_effect: Imposed modified Bill of Rights protections on tribal governments,
    while preserving tribal sovereign immunity (Santa Clara Pueblo v. Martinez).
  current_status: Controlling federal statutory law.
  official_url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title25-section1301&num=0&edition=prelim
- date: '1978'
  event: Indian Child Welfare Act (ICWA)
  authority: 25 U.S.C. §§ 1901-1963 (92 Stat. 3069)
  legal_effect: Established federal minimum standards and procedural requirements
    for state child custody proceedings involving Indian children.
  current_status: Upheld by Supreme Court in Haaland v. Brackeen, 599 U.S. 255 (2023).
  official_url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title25-section1901&num=0&edition=prelim
- date: '1978'
  event: American Indian Religious Freedom Act (AIRFA)
  authority: 42 U.S.C. § 1996 (92 Stat. 469)
  legal_effect: Affirmed federal policy to protect and preserve Native American rights
    to practice traditional religions, access sacred sites, and use sacred objects.
  current_status: Controlling federal policy statement.
  official_url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section1996&num=0&edition=prelim
- date: '1988'
  event: Indian Gaming Regulatory Act (IGRA)
  authority: 25 U.S.C. §§ 2701-2721 (102 Stat. 2467)
  legal_effect: Created federal statutory framework for tribal gaming, requiring tribal-state
    compacts for Class III casino gaming.
  current_status: Controlling federal statutory framework.
  official_url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title25-section2701&num=0&edition=prelim
- date: '1990'
  event: Native American Graves Protection and Repatriation Act (NAGPRA)
  authority: 25 U.S.C. §§ 3001-3013 (104 Stat. 3048)
  legal_effect: Mandated federal agencies and museums to inventory and repatriate
    Native American cultural items, funerary objects, and human remains to lineal
    descendants and tribes.
  current_status: Controlling federal statutory law; reinforced by 2024 DOI regulations.
  official_url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title25-section3001&num=0&edition=prelim
- date: '1994'
  event: Violence Against Women Act (VAWA) Tribal Jurisdiction Provisions
  authority: 25 U.S.C. § 1304 (Reauthorized 2013 & 2022)
  legal_effect: Recognized and restored tribal criminal jurisdiction over non-Indian
    perpetrators of domestic violence, dating violence, and sexual assault against
    Native victims on tribal lands.
  current_status: Controlling federal statutory law.
  official_url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title25-section1304&num=0&edition=prelim
- date: '2010'
  event: U.S. Formal Endorsement of UNDRIP
  authority: Presidential Announcement (Dec 16, 2010)
  legal_effect: United States joined international consensus endorsing the United
    Nations Declaration on the Rights of Indigenous Peoples as an international aspirational
    standard.
  current_status: Non-binding international norm in domestic law.
  official_url: https://www.state.gov/remarks-at-the-white-house-tribal-nations-conference/
- date: '2020'
  event: McGirt v. Oklahoma — Reservation Boundaries Reaffirmed
  authority: 591 U.S. 894
  legal_effect: Affirmed that Congress never disestablished the Muscogee (Creek) Nation
    reservation, confirming that eastern Oklahoma remains Indian Country.
  current_status: Binding Supreme Court precedent.
  official_url: https://supreme.justia.com/cases/federal/us/591/894/
- date: '2022'
  event: Department of the Interior Federal Indian Boarding School Report
  authority: DOI Federal Indian Boarding School Initiative Investigative Report
  legal_effect: Official federal accounting of the systematic boarding school program,
    documenting 408 institutions and marked/unmarked burial sites across 53 schools.
  current_status: Official Department of the Interior findings.
  official_url: https://www.doi.gov/sites/doi.gov/files/2022-06/bsi_investigative_report_june_2022_0.pdf
- date: '2023'
  event: Haaland v. Brackeen — Supreme Court Upholds ICWA
  authority: 599 U.S. 255
  legal_effect: Rejected anti-commandeering and equal protection constitutional challenges,
    affirming the constitutionality of the Indian Child Welfare Act.
  current_status: Controlling Supreme Court precedent.
  official_url: https://supreme.justia.com/cases/federal/us/599/255/
