region: Great Lakes
nations:
- name: Mille Lacs Band of Ojibwe
  official_website: https://millelacsband.com/
  governing_treaty: Treaty of 1837, 7 Stat. 536
  jurisdiction_notes: Affirmed usufructuary hunting and fishing rights in Minnesota
    v. Mille Lacs Band, 526 U.S. 172 (1999); active tribal court.
