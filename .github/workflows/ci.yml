name: Legal-GPT CI & Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-tests:
    name: Privacy Audit & Automated Test Suite
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest httpx

      - name: Run Privacy & Data Isolation Security Gate
        run: |
          python scripts/privacy_audit.py
          python scripts/deep_security_audit.py

      - name: Run Full Test Suite
        run: |
          pytest -v

      - name: Run 50-Scenario Legal Benchmark Evaluation
        run: |
          python cli.py benchmark --category all
