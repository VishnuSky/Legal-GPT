[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-gpt"
version = "0.1.0"
description = "Jurisdiction-Aware, Temporal, Citation-Verified Legal Intelligence Platform for Local AI & CPS Case Work"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "python-dateutil>=2.9.0",
    "networkx>=3.3",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]
